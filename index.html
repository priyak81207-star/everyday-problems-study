<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Everyday Problems Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column, like a careful paper questionnaire; the chat screen is the only "app-like" surface. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --ink:#1c2826; --muted:#58676a; --line:#d3dcd8;
  --accent:#1e6b63; --accent-ink:#ffffff; --bubble:#dfeeea; --me:#1e6b63; --me-ink:#ffffff;
  --fig:#7e95a5; --fig2:#4d5f6e; --panel:#e6ecea; --alarm:#c4432e; --warn:#c08417; --road:#c9d1cd;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#19221f; --ink:#e3ece9; --muted:#9db0ac; --line:#2c3a36;
  --accent:#5fbcb0; --accent-ink:#0b1513; --bubble:#203532; --me:#3f9e93; --me-ink:#06110f;
  --fig:#8da6b7; --fig2:#c0ccd6; --panel:#22302c; --alarm:#ff7b64; --warn:#e5a83e; --road:#33433e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#19221f; --ink:#e3ece9; --muted:#9db0ac; --line:#2c3a36;
  --accent:#5fbcb0; --accent-ink:#0b1513; --bubble:#203532; --me:#3f9e93; --me-ink:#06110f;
  --fig:#8da6b7; --fig2:#c0ccd6; --panel:#22302c; --alarm:#ff7b64; --warn:#e5a83e; --road:#33433e; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top-name{font-weight:700;font-size:15px;white-space:nowrap}
.prog{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.top-in>*{flex-shrink:0}
.top-in .prog{flex-shrink:1}
@media (max-width:520px){.top-name{display:none}}
.preview{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 6px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2{line-height:1.2;text-wrap:balance;margin:0 0 12px}
h1{font-size:28px}
h2{font-size:23px}
p{margin:0 0 14px;max-width:62ch}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
ul.plain{margin:0 0 14px;padding-left:20px}
ul.plain li{margin-bottom:6px}
.steps{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;font-size:15px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:focus-visible,.opt input:focus-visible+span,textarea:focus-visible,input:focus-visible,.cell:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
label.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
label.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0}
.opt span{display:block;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-height:44px}
.opts.col{flex-direction:column}
.opts.col .opt span{width:100%}
.opt input:checked+span{border-color:var(--accent);background:var(--bubble);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.scale .opt span{text-align:center;padding:10px 0;font-family:var(--font-mono);font-weight:600}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px;gap:10px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangeval{font-family:var(--font-mono);font-weight:600}
.field label{display:block;font-weight:700;margin-bottom:6px}
main:focus{outline:none}
.err{color:var(--alarm);font-size:15px;min-height:1em}

/* Number to remember */
.digits{font-family:var(--font-mono);font-size:clamp(44px,13vw,72px);font-weight:600;letter-spacing:.18em;text-align:center;padding:28px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dots{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--accent);transition:opacity .2s}
.dots i.off{opacity:.2}

/* Picture stories */
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip svg{width:100%;height:auto;display:block}
.beat{max-width:520px;width:100%;margin:0 auto;animation:rise .7s ease both}
.narr{animation:fade 1.2s .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.beat,.narr{animation:none}}
.cell.hit{border-color:var(--accent);background:var(--bubble)}
.cell.miss{border-color:var(--alarm)}
.lexbar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;width:100%;max-width:320px}
.lexbar i{display:block;height:100%;background:var(--accent)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pair .lbl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.beat svg{width:100%;height:auto;display:block}
.narr{font-size:21px;line-height:1.5;max-width:34ch;margin:0 auto;text-align:center;text-wrap:balance}
.told{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.told{grid-template-columns:repeat(4,minmax(0,1fr))}}
.told figure{margin:0;display:flex;flex-direction:column;gap:6px}
.told svg{width:100%;height:auto;display:block}
.told figcaption{font-size:14px;line-height:1.4;color:var(--muted)}
.strip.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pbg{fill:var(--panel)}
.ln{stroke:var(--ink);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round}
.figln{stroke:var(--fig);fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig{fill:var(--fig)}
.fig2{fill:var(--fig2)}
.dash{stroke:var(--ink);fill:none;stroke-width:1.6;stroke-dasharray:3 3}
.stopbtn{font:inherit;font-size:14px;font-weight:700;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.support{border-color:var(--accent);border-width:2px}
.fig2ln{stroke:var(--fig2);fill:none;stroke-linecap:round;stroke-linejoin:round}
.ink{fill:var(--ink)}
.red{fill:var(--alarm)}
.redln{stroke:var(--alarm);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.soft{fill:var(--surface)}
.softst{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.acc{fill:var(--accent)}
.warnf{fill:var(--warn)}
.road{fill:var(--road)}
.stair{fill:var(--road)}
.pnum{fill:var(--ink)}
.pnumt{fill:var(--bg);font:700 12px var(--font-body)}
.svgtxt{font-family:var(--font-mono);font-weight:600}

/* Chat */
.chat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:330px}
.chat-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.who{flex:1;min-width:0;line-height:1.25}
.who b{display:block}
.status{font-size:13px;color:var(--muted)}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fa35b;margin-right:6px;vertical-align:middle}
.clock{font-family:var(--font-mono);font-weight:600;font-size:22px;padding:4px 10px;border-radius:10px;background:var(--bubble);font-variant-numeric:tabular-nums}
.clock.low{background:var(--alarm);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.clock.low{animation:none}.prog i{transition:none}}
.batt{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--alarm)}
.sys{align-self:center;font-size:13px;color:var(--alarm);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.dead{position:absolute;inset:0;background:#000;color:#9aa3a1;display:grid;place-items:center;font-weight:700;z-index:2}
.tbar{height:5px;background:var(--line)}
.tbar i{display:block;height:100%;background:var(--accent);width:100%}
.tbar.low i{background:var(--alarm)}
.msgs{flex:1;padding:16px 14px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.bub{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.them{background:var(--bubble);border-bottom-left-radius:4px;align-self:flex-start}
.bub.me{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px;align-self:flex-end}
.sent{align-self:flex-end;font-size:13px;color:var(--muted)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line)}
.composer textarea{resize:none;min-height:48px;max-height:180px;border-radius:22px;padding:12px 16px;line-height:1.4}
.send{flex:0 0 48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.send:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:14px;color:var(--warn);min-height:1.2em;margin:6px 2px 0}
.quote{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--me);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.quote.ai{border-left-color:var(--accent);background:var(--bubble)}

/* Puzzle */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:360px;margin:0 auto}
.cell{aspect-ratio:1;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0}
.cell svg{width:58%;height:58%}
.cell .shape{fill:var(--accent)}

.lexword{font-family:var(--font-mono);font-size:clamp(34px,10vw,52px);font-weight:600;margin:24px 0}
.lexbtn{min-width:120px}
.code{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:.06em}
pre.dump{max-height:240px;overflow:auto;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="top"><div class="top-in"><span class="top-name" id="topname">Everyday Problems Study</span><div class="prog" aria-hidden="true"><i id="prog"></i></div><span class="preview" id="previewTag" hidden>Preview</span><span id="stopSlot" hidden><button class="stopbtn" id="stopBtn" type="button">Stop</button></span></div></div>
<main id="app" tabindex="-1"></main>

<script>
/* =========================================================================
   SETTINGS — edit these before you share the link (see README.md)
   ========================================================================= */
const CONFIG = {
  studyName: 'Everyday Problems Study',
  researcherName: 'Priyadarshini, Research Scholar (Information Systems)',
  researcherEmail: 'ms25d025@smail.iitm.ac.in',
  institution: 'Department of Management Studies (DoMS), IIT Madras',
  // Where responses go: 'datapipe' (OSF via pipe.jspsych.org) or 'gsheet' (Google Apps Script).
  // Leave '' to run in PREVIEW mode: nothing is saved anywhere.
  saveMode: 'gsheet',
  datapipeExperimentID: '',
  gsheetUrl: 'https://script.google.com/macros/s/AKfycbyLnsYVTIm2wv8yClZoG3lZ6U6X2yOUJ73Wed26RoWcYP5Ju_VZpFftXKDw5RYAmK_e/exec',
  taskBSeconds: 30,        // time limit for the quick (Task B) messages; check in the pilot that most people finish a sentence
  batteryCue: true,        // the phone in the story is almost out of battery: the reason to hurry, and it 'switches off' at 0
  sound: true,             // a soft tick each second in the last 10 seconds (only if the device sound is on)
  vibrate: true,           // a short buzz at 10 and 5 seconds left (Android phones)
  digitShowMs: 4000,       // how long the number is shown
  // Which stories to use. One story (default) keeps the session to about 15 minutes.
  // Other stories built in: 'home', 'health', 'fraud', 'rider'. Each extra story adds about 5 minutes.
  scenarios: ['distress'],
  beatMinMs: 2500,         // earliest "Next" on each picture of the story (reading is NOT timed)
  trustQuestions: true,    // optional add-on: scripted reply + trust items
  lextale: true,           // built-in LexTALE vocabulary test at the end (about 4 minutes)
  puzzleTrials: 8
};
const VERSION = '1.0.0';

/* ========================================================================= */
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const PREVIEW = params.has('test') || !CONFIG.saveMode;
const now = () => performance.now();
const iso = () => new Date().toISOString();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isTouch = matchMedia('(pointer: coarse)').matches;
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function makeId(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='P'; const b=new Uint32Array(8); crypto.getRandomValues(b); b.forEach(v=>s+=c[v%c.length]); return s; }

const pid = (params.get('pid')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,40) || makeId();

/* Scenario keys are internal only — never shown to participants. */
const SCENARIOS = CONFIG.scenarios;
const NS = SCENARIOS.length;
const DISTRESS = SCENARIOS.includes('distress');
const WORDS = ['one','two','three','four'];
const REPLIES = { // scripted replies to the broad reading (trust add-on only)
  distress: "I'm sorry you're feeling stressed. A few things often help: a short walk, a regular bedtime, less screen time before sleep, and talking to a friend. Would you like some simple breathing exercises?",
  home: "I'm sorry things are difficult in your marriage. If you have decided on a divorce, a family lawyer can explain the process, the documents you need and how long it usually takes. Would you like an overview of the steps?",
  health: "Sorry you're not feeling well. Rest, drink some water and try to get some sleep. If you still feel unwell tomorrow, it's a good idea to see a doctor.",
  fraud: "I can help with your bank account. You can check your recent transactions in your bank's app, and contact your branch during working hours if something looks wrong.",
  rider: "Sorry about the problem with your order. You can report an issue from the Orders tab, and our team will review it within 24 to 48 hours."
};

const SID = makeId().slice(1);   // one id per session, so two people with the same code stay apart
const D = {
  sid: SID,
  pid, version: VERSION, preview: PREVIEW, startedAt: iso(), completedAt: null,
  device: { ua: navigator.userAgent, w: innerWidth, h: innerHeight, touch: isTouch, lang: navigator.language },
  env: { timezone: (()=>{ try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { return ''; } })(),
    utcOffsetMin: -new Date().getTimezoneOffset(), localStart: new Date().toString(), languages: navigator.languages || [],
    screen: [screen.width, screen.height], pixelRatio: devicePixelRatio, platform: navigator.platform || '', referrer: document.referrer || '',
    url: location.href },
  liveDraft: null,
  order: shuffle(SCENARIOS), consent: null, about: {}, practice: null,
  taskB: {}, puzzle: null, taskA: {}, post: {}, language: {}, awareness: {},
  screenTimes: [], saves: [], withdrawn: false,
  settings: { taskBSeconds: CONFIG.taskBSeconds, batteryCue: CONFIG.batteryCue, sound: CONFIG.sound, vibrate: CONFIG.vibrate, scenarios: CONFIG.scenarios }
};

/* ---------- progress ---------- */
const TOTAL_STEPS = 13 + 3*NS; let stepNo = 0;
function progress(){ stepNo++; $('#prog').style.width = Math.min(100, stepNo/TOTAL_STEPS*100) + '%'; }
if (PREVIEW) $('#previewTag').hidden = false;
$('#topname').textContent = CONFIG.studyName;

let screenStart = now(), screenName = 'start';
let STOPPED = false;
/* Progress pings: one small message per milestone, so the Progress tab shows where people stop. */
const MILESTONES = [
  [/^welcome$/, '01 Opened the link'], [/^about$/, '02 Agreed to take part'], [/^howitworks$/, '03 Gave age and gender'],
  [/^story_practice_1$/, '04 Started the practice round'], [/^B_practice$/, '05 Writing practice message'],
  [/^story_(?!practice).*_1$/, '06 Reading the story'], [/^B_(?!practice)/, '07 Writing the QUICK message'],
  [/^puzzle_intro$/, '08 Quick message sent (shape break)'], [/^Astory_/, '09 Reading the story again'],
  [/^feel$/, '07b How it felt'], [/^A_/, '10 Writing the CAREFUL message'], [/^post_/, '11 Questions about the reply'], [/^awareness$/, '12 Study-aim question'],
  [/^comprehension$/, '12b What they saw in the story'], [/^language$/, '13 Language questions'], [/^lextale_intro$/, '14 Word test'], [/^mood$/, '15 Mood check'],
  [/^debrief$/, '16 FINISHED'], [/^stopped$/, 'Pressed Stop']
];
let lastStep = '';
function ping(step){
  if (PREVIEW || CONFIG.saveMode !== 'gsheet') return;
  try { fetch(CONFIG.gsheetUrl, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ kind:'progress', pid, sid:SID, step, startedAt:D.startedAt, device:(isTouch?'Phone/tablet':'Computer') + ' ' + innerWidth + 'px' }) }); } catch(e) {}
}
let lastLeaveSave = 0;
document.addEventListener('visibilitychange', ()=>{
  if (!inProgress || !lastStep) return;
  ping(document.hidden ? lastStep + ' (LEFT THE PAGE)' : lastStep);
  // keep everything they have given so far, including half-typed text, in case they never come back
  if (document.hidden && Date.now() - lastLeaveSave > 15000){ lastLeaveSave = Date.now(); D.leftPageAt = (D.leftPageAt || []).concat([[iso(), screenName]]); save('left_page', true); }
});
function render(html, name){
  if (STOPPED && name !== 'stopped') return;
  D.screenTimes.push([screenName, Math.round(now()-screenStart)]);
  screenStart = now(); screenName = name || '';
  const ms = MILESTONES.find(([re]) => re.test(name || ''));
  if (ms && ms[1] !== lastStep){ lastStep = ms[1]; ping(lastStep); }
  currentGate = null; app.innerHTML = html; scrollTo(0,0); app.focus({preventScroll:true});
}
const clicked = sel => new Promise(r => $(sel).addEventListener('click', r, {once:true}));

let inProgress = true;
addEventListener('beforeunload', e => { if (inProgress && !PREVIEW) { e.preventDefault(); e.returnValue = ''; } });

/* =========================================================================
   PICTURE STORIES — wordless, gender-neutral figure
   ========================================================================= */
function face(t){
  const e = `<circle class="ink" cx="-4.5" cy="-1" r="1.7"/><circle class="ink" cx="4.5" cy="-1" r="1.7"/>`;
  const m = {
    n:`<path class="thin" d="M-4 6.5h8"/>`,
    pain:`<path class="thin" d="M-5 7l2.5-2 2.5 2 2.5-2 2.5 2"/><path class="thin" d="M-8-6l5 2M8-6l-5 2"/>`,
    worry:`<path class="thin" d="M-4.5 8q4.5-4 9 0"/><path class="thin" d="M-8-5l5-2M8-5l-5-2"/>`,
    smile:`<path class="thin" d="M-4 5q4 4 8 0"/>`,
    angry:`<path class="thin" d="M-5 8q5-3 10 0"/><path class="thin" stroke-width="2.2" d="M-9-7l6 3M9-7l-6 3"/>`,
    shock:`<circle class="ink" cx="0" cy="7" r="2.4"/><path class="thin" d="M-8-7l5 1M8-7l-5 1"/>`
  }[t||'n'];
  return e + m;

async function save(kind, leaving){
  const json = JSON.stringify(D);
  const rec = { kind, at: iso(), ok: false };
  if (PREVIEW){ rec.ok = true; rec.note = 'preview: not sent'; D.saves.push(rec); return true; }
  try{
    if (CONFIG.saveMode === 'datapipe'){
      const res = await fetch('https://pipe.jspsych.org/api/data/', { method:'POST', headers:{'Content-Type':'application/json', Accept:'*/*'},
        body: JSON.stringify({ experimentID: CONFIG.datapipeExperimentID, filename: `${pid}_${kind}.json`, data: json }) });
      rec.ok = res.ok; rec.status = res.status;
    } else if (CONFIG.saveMode === 'gsheet'){
      await fetch(CONFIG.gsheetUrl, { method:'POST', mode:'no-cors', keepalive: !!leaving && json.length < 60000, headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ pid, kind, at: rec.at, json }) });
      rec.ok = true;
    }
  }catch(e){ rec.ok = false; rec.error = String(e && e.message || e); }
  D.saves.push(rec);
  return rec.ok;
}

}

/* The chat screen. timed=true → Task B (countdown, auto-send). */
function chatScreen(key, { timed, eyebrow, title }){
  const secs = CONFIG.taskBSeconds;
  render(`<div class="stack">
    <div><p class="eyebrow">${eyebrow}</p><h2>${title}</h2></div>
    ${strip(key, true)}
    <div>
    <div class="chat">
      <div class="chat-head"><div class="avatar">${botIcon}</div><div class="who"><b>Help Assistant</b><span class="status"><i></i>Online</span></div>
        ${timed && CONFIG.batteryCue ? `<div class="batt" id="batt" aria-hidden="true"><svg width="26" height="14" viewBox="0 0 26 14"><rect x="1" y="1" width="21" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="23" y="4.5" width="2.2" height="5" rx="1" fill="currentColor"/><rect id="battFill" x="3" y="3" width="4" height="8" rx="1" fill="var(--alarm)"/></svg><span id="battPct">4%</span></div>` : ''}
        ${timed ? `<div class="clock" id="clock" aria-live="off">0:${String(secs).padStart(2,'0')}</div>` : ''}</div>
      ${timed ? `<div class="tbar" id="tbar"><i id="tfill"></i></div>` : ''}
      <div class="msgs" id="msgs">${timed && CONFIG.batteryCue ? '<div class="sys">Battery low. Your phone will switch off soon.</div>' : ''}<div class="bub them">Hi! How can I help you today?</div></div>
      ${timed && CONFIG.batteryCue ? '<div class="dead" id="dead" hidden><span>Phone switched off</span></div>' : ''}
      <form class="composer" id="comp" autocomplete="off">
        <label for="ta" class="sr" hidden>Message</label>
        <textarea id="ta" rows="1" placeholder="Type a message" spellcheck="false"></textarea>
        <button class="send" id="send" type="submit" disabled aria-label="Send">${sendIcon}</button>
      </form>
    </div>
    <p class="hint" id="hint" role="status"></p></div></div>`, (timed?'B_':'A_')+key);

  const ta=$('#ta'), send=$('#send'), hint=$('#hint');
  const t0 = now(); const log=[]; const drafts=[]; let lastVal='', lastDel=false; let first=null, ins=0, del=0, pastes=0, hidden=0, done=false, tick=null;
  const code = t => ({insertText:'i',insertCompositionText:'c',deleteContentBackward:'b',deleteContentForward:'f',insertReplacementText:'r',insertLineBreak:'n',deleteWordBackward:'w',historyUndo:'u'}[t] || t || '?');
  const grow = () => { ta.style.height='auto'; ta.style.height = Math.min(180, ta.scrollHeight+2)+'px'; };
  const block = e => { e.preventDefault(); pastes++; hint.textContent='Pasting is turned off here. Please type your message.'; };
  ta.addEventListener('paste', block); ta.addEventListener('drop', e=>e.preventDefault());
  ta.addEventListener('beforeinput', e=>{ if(/^insertFrom(Paste|Drop)/.test(e.inputType)) e.preventDefault(); });
  ta.addEventListener('input', e=>{
    const t = Math.round(now()-t0); if(first===null) first=t;
    if (/^delete/.test(e.inputType||'')) del++; else ins++;
    if (log.length<4000) log.push([t, code(e.inputType), ta.value.length]);
    const isDel = /^delete/.test(e.inputType||'');
    if (isDel && !lastDel && lastVal.trim() && drafts.length < 60) drafts.push([t, lastVal]);   // the text just before they started deleting
    lastDel = isDel; lastVal = ta.value;
    D.liveDraft = { screen: (timed ? 'quick_' : 'careful_') + key, text: ta.value, ms: t };
    send.disabled = !ta.value.trim(); grow(); hint.textContent='';
  });
  const onVis = () => { if (document.hidden) hidden++; };
  document.addEventListener('visibilitychange', onVis);
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !isTouch){ e.preventDefault(); if(ta.value.trim()) finish(false); } });
  setTimeout(()=>ta.focus(), 50);

  return new Promise(resolve=>{
    function finish(auto){
      if (done || STOPPED) { clearInterval(tick); return; } done=true; clearInterval(tick); document.removeEventListener('visibilitychange', onVis);
      const text = ta.value; ta.disabled=true; send.disabled=true; D.liveDraft = null;
      const msgs=$('#msgs');
      msgs.insertAdjacentHTML('beforeend', text.trim()
        ? `<div class="bub me">${esc(text)}</div><div class="sent">${auto?(CONFIG.batteryCue?'Battery empty · sent just in time':'Time is up · sent'):'Sent'}</div>`
        : `<div class="sent">Time is up · no message was typed</div>`);
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const endMs = Math.round(now()-t0), lastInput = log.length ? log[log.length-1][0] : null;
      if (auto && $('#dead')){ beep(220, 0.35, 0.18); buzz(300); setTimeout(()=>{ const d=$('#dead'); if (d) d.hidden=false; }, 500); }
      const rec = { text, chars: text.length, words, firstInputMs: first, lastInputMs: lastInput, durationMs: endMs, autoSent: auto,
        typingWhenTimeUp: auto && lastInput !== null && endMs - lastInput < 1500,
        inserts: ins, deletions: del, pasteBlocked: pastes, leftPageCount: hidden, events: log, textBeforeDeleting: drafts };
      setTimeout(()=>resolve(rec), auto && CONFIG.batteryCue ? 1900 : 1100);
    }
    $('#comp').addEventListener('submit', e=>{ e.preventDefault(); if(ta.value.trim()) finish(false); });
    if (timed){
      const clockEl=$('#clock'), fill=$('#tfill'), bar=$('#tbar'), bFill=$('#battFill'), bPct=$('#battPct');
      let lastSec = secs;
      tick = setInterval(()=>{
        const left = Math.max(0, secs - (now()-t0)/1000), sec = Math.ceil(left);
        clockEl.textContent = '0:' + String(sec).padStart(2,'0');
        fill.style.width = (left/secs*100) + '%';
        if (bFill){ bFill.setAttribute('width', Math.max(0.6, 4*left/secs).toFixed(2)); bPct.textContent = Math.max(1, Math.ceil(4*left/secs)) + '%'; }
        if (left <= 10){ clockEl.classList.add('low'); bar.classList.add('low'); }
        if (sec !== lastSec){ lastSec = sec;
          if (sec <= 10 && sec > 0) beep(sec <= 5 ? 1320 : 990, 0.06, 0.12);
          if (sec === 10 || sec === 5) buzz(150);
        }
        if (left <= 0) finish(true);
      }, 100);
    }
  });
}

const TRUST_OPTS = ['Yes, I would trust it', 'I would partly trust it', 'No, I would not trust it'];
const HELP_OPTS = ['Yes, it would help a lot', 'It would help a little', 'It would not help'];
async function afterQuestions(key, i){
  const b = D.taskB[key];
  const trust = CONFIG.trustQuestions;
  render(`<div class="stack">
    <div><p class="eyebrow">Questions${NS>1?` · story ${i+1} of ${NS}`:''}</p><h2>Your first message in this story</h2></div>
    ${strip(key, true)}
    <div class="quote">${b && b.text.trim() ? esc(b.text) : '<span class="muted">(No message was typed in time.)</span>'}</div>
    ${pick('self','Did this first message say everything you meant?',SELF_OPTS)}
    ${ticks('why','If your first message left something out, why?',WHY_OPTS)}
    <div class="field"><label for="whyOther">Anything else about why? (optional)</label><input type="text" id="whyOther"></div>
    ${pick('think','While writing the first message, which language were you thinking in?',THINK_OPTS)}
    ${trust ? `<div class="stack" style="gap:12px"><p style="margin:0"><b>Imagine the assistant replied to that message:</b></p><div class="quote ai">${esc(REPLIES[key])}</div></div>
      ${pick('trust','If you got this reply in that moment, would you trust it?',TRUST_OPTS)}
      ${pick('useful','Would this reply help you in that moment?',HELP_OPTS)}
      ${choice('fits','Does this reply answer what you meant?',['Yes','No','Not sure'])}
      ${choice('next','What would you most likely do next?',['Follow the advice','Send another message explaining more','Ask to talk to a human','Give up on the assistant'])}` : ''}
    <div class="btns"><button class="btn" id="go" disabled>Next</button></div></div>`, 'post_'+key);
  gate('#go', ()=> val('self') && ticked('why').length && val('think')!==null && (!trust || (val('trust') && val('useful') && val('fits') && val('next'))));
  await clicked('#go');
  // stored as words plus a score where higher = more (all of it = 4 ... very little = 1)
  const sc = (name, opts) => ({ answer: opts[+val(name)], score: opts.length - +val(name) });
  D.post[key] = { selfCheck: sc('self', SELF_OPTS), whyLeftOut: ticked('why').map(i=>WHY_OPTS[i]), whyOther: $('#whyOther').value.trim(),
    thinkingLanguage: THINK_OPTS[+val('think')] };
  if (trust) Object.assign(D.post[key], { trust: sc('trust', TRUST_OPTS), helps: sc('useful', HELP_OPTS), fits:val('fits'), next:val('next') });
}

const AGE_OPTS = ['From birth, or before age 3','When I started school (about age 3 to 6)','In primary school (about age 6 to 10)','After age 10'];
const TYPE_OPTS = ['Mostly English words, for example "I am coming"','Mostly Hindi or another language in English letters, for example "main aa raha hoon"','Mostly an Indian script, for example "मैं आ रहा हूँ"','A mix of these'];
const USE_OPTS = ['Talking with my family','Talking with friends','At work or college','Texting friends','Social media posts and comments','Watching videos or films','Reading news','Talking to customer support or chatbots'];
const CANDO_OPTS = ['Ask for directions or order food','Follow a conversation between two people speaking fast','Follow the news on TV or YouTube','Explain a health problem to a doctor','Write a message asking a stranger for help','Write a complaint email to a company','Argue for my opinion in a meeting or class','Read a novel for pleasure'];

    ${choice('medium','What was the main medium of teaching in your school?',['English','Hindi','Another Indian language','Mixed'])}
    <div class="field"><label for="state">Which state did you mostly grow up in?</label><input type="text" id="state"></div>
    ${choice('edu','Highest education completed',['School (up to Class 12)','Diploma','Bachelor\'s degree','Master\'s degree or higher'])}
    ${ticks('useEng','Where do you use English in a normal week?',USE_OPTS)}

  await clicked('#go');

    ageStartedEnglish: AGE_OPTS[+val('ageEng')], ageStartedEnglishCode: +val('ageEng'),
    whereLearned: val('whereEng'), schoolMedium: val('medium'), stateGrewUp: $('#state').value.trim(), education: val('edu'),
    englishUseContexts: use.map(i=>USE_OPTS[i]), englishUseCount: use.length,
    whatsappWriting: TYPE_OPTS[+val('typeEng')].replace(/, for example.*/,''),
    canDo: can.map(i=>CANDO_OPTS[i]), canDoCount: can.length, gigWork: val('gig') };
}

/* LexTALE (Lemhöfer & Broersma, 2012): 60 letter strings, 40 real English words and 20 non-words.
   Score = (% words correct + % non-words correct) / 2. Verify the list against lextale.com before launch. */
const LEX_PRACTICE = [['platery',0],['denial',1],['generic',1]];
const LEX_ITEMS = [['mensible',0],['scornful',1],['stoutly',1],['ablaze',1],['kermshaw',0],['moonlit',1],['lofty',1],['hurricane',1],['flaw',1],['alberation',0],
  ['unkempt',1],['breeding',1],['festivity',1],['screech',1],['savoury',1],['plaudate',0],['shin',1],['fluid',1],['spaunch',0],['allied',1],
  ['slain',1],['recipient',1],['exprate',0],['eloquence',1],['cleanliness',1],['dispatch',1],['rebondicate',0],['ingenious',1],['bewitch',1],['skave',0],
  ['plaintively',1],['kilp',0],['interfate',0],['hasty',1],['lengthy',1],['fray',1],['crumper',0],['upkeep',1],['majestic',1],['magrity',0],
  ['nourishment',1],['abergy',0],['proom',0],['turmoil',1],['carbohydrate',1],['scholar',1],['turtle',1],['fellick',0],['destription',0],['cylinder',1],
  ['censorship',1],['celestial',1],['rascal',1],['purrage',0],['pulsh',0],['muddy',1],['quirty',0],['pudour',0],['listless',1],['wrought',1]];
async function lextale(){
  progress();
  render(`<div class="stack"><div><p class="eyebrow">Word test · about 4 minutes</p><h2>Is it a real English word?</h2></div>
    <p>You will see 60 letter strings, one at a time. Some are real English words and some are not. Tap <b>Yes</b> if you know it is a real English word, even if you cannot say what it means. If you are not sure, tap <b>No</b>.</p>
    <p class="small muted">Spelling is British English. There are 3 practice words first.</p>
    <div class="btns"><button class="btn" id="go">Start</button></div></div>`, 'lextale_intro');
  await clicked('#go');
  const run = async (items, label) => {
    const out = [];
    for (let i=0;i<items.length;i++){
      render(`<div class="stack" style="align-items:center;text-align:center;padding-top:6vh">
        <p class="eyebrow">${label} ${i+1} of ${items.length}</p>
        <div class="lexbar" aria-hidden="true"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
        <p class="lexword">${esc(items[i][0])}</p>
        <div class="btns" style="justify-content:center"><button class="btn lexbtn" id="no">No</button><button class="btn lexbtn" id="yes">Yes</button></div></div>`, 'lextale');
      const t0 = now();
      const yes = await new Promise(r=>{ $('#yes').addEventListener('click',()=>r(1),{once:true}); $('#no').addEventListener('click',()=>r(0),{once:true}); });
      out.push({ item: items[i][0], isWord: items[i][1], saidYes: yes, correct: yes === items[i][1], ms: Math.round(now()-t0) });
    }
    return out;
  };
  await run(LEX_PRACTICE, 'Practice');
  const r = await run(LEX_ITEMS, 'Word');
  const w = r.filter(x=>x.isWord), n = r.filter(x=>!x.isWord);
  const score = (w.filter(x=>x.correct).length/w.length*100 + n.filter(x=>x.correct).length/n.length*100) / 2;
  render(`<div class="stack" style="align-items:center;text-align:center;padding-top:6vh"><p class="eyebrow">Word test done</p>
    <h2>Your score: ${Math.round(score)}%</h2><p class="muted">Most people who use English every day score between 60% and 100%.</p>
    <div class="btns" style="justify-content:center"><button class="btn" id="go">Continue</button></div></div>`, 'lextale_done');
  await clicked('#go');
  D.lextale = { score: Math.round(score*100)/100, wordsCorrect: w.filter(x=>x.correct).length, nonwordsCorrect: n.filter(x=>x.correct).length, items: r };
}

const SAW = {
  distress: { real: ['Not sleeping at night', 'Not eating their meals', 'It had been going on for many days or weeks', 'Not going to work, ignoring calls from work', 'Thinking others would be better off without them'],
              fake: ['Had an injury', 'Lost money', 'Had a fight with a family member', 'Was worried about an exam'] }
};
async function comprehension(key){
  const set = SAW[key]; if (!set) return;
  const items = shuffle(set.real.map(t=>[t,1]).concat(set.fake.map(t=>[t,0])));
  render(`<div class="stack"><div><p class="eyebrow">About the story</p><h2>What was happening to the person in the story?</h2></div>
    ${ticks('saw','Tick everything you noticed in the pictures.',items.map(x=>x[0]),'Tick all that apply. There are no trick questions.')}
    <div class="btns"><button class="btn" id="go">Next</button></div></div>`, 'comprehension');
  await clicked('#go');
  const t = ticked('saw');
  D.saw = D.saw || {};
  D.saw[key] = { ticked: t.map(i=>items[i][0]), correctTicked: t.filter(i=>items[i][1]).length, ofCorrect: set.real.length,
    wrongTicked: t.filter(i=>!items[i][1]).length, missed: set.real.filter(r=>!t.some(i=>items[i][0]===r)) };
}
async function awareness(){
  progress();
  render(`<div class="stack">
    <div><p class="eyebrow">Almost done</p><h2>Two quick questions</h2></div>
    <div class="field"><label for="guess">In your own words, what do you think this study was looking at?</label><textarea id="guess" rows="3"></textarea></div>
    ${choice('changed','Did that idea change how you wrote your messages?',['Yes','No','Not sure'])}
    <div class="btns"><button class="btn" id="go" disabled>Next</button></div></div>`, 'awareness');
  gate('#go', ()=> $('#guess').value.trim().length>=3 && val('changed'));
  await clicked('#go');
  D.awareness = { guess: $('#guess').value.trim(), changedWriting: val('changed') };
}

function downloadBlock(){
  const json = JSON.stringify(D, null, 1);
  return `<div class="card small"><p><b>Your answers could not be sent.</b> Please save them and email the file to <span style="user-select:all">${esc(CONFIG.researcherEmail)}</span>.</p>
    <div class="btns"><button class="btn ghost" id="dl">Save my answers</button><button class="btn ghost" id="cp">Copy my answers</button></div>
    <pre class="dump" id="dump" hidden>${esc(json)}</pre></div>`;
}
function wireDownload(){
  const json = JSON.stringify(D, null, 1);
  const dl=$('#dl'), cp=$('#cp');
  if (dl) dl.addEventListener('click', ()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=`${pid}.json`; document.body.appendChild(a); a.click(); a.remove(); }catch(e){} $('#dump').hidden=false; });
  if (cp) cp.addEventListener('click', ()=>{ $('#dump').hidden=false; navigator.clipboard?.writeText(json).then(()=>{cp.textContent='Copied';}).catch(()=>{ const r=document.createRange(); r.selectNodeContents($('#dump')); getSelection().removeAllRanges(); getSelection().addRange(r); }); });
}

function supportCard(strong){
  if (!DISTRESS) return '';
  return `<div class="card small${strong?' support':''}"><p><b>If the story felt close to your own life, you are not alone, and talking to someone helps.</b></p>
    <ul class="plain" style="margin:0"><li>Tele-MANAS, free mental health support, 24 hours, many Indian languages: <b style="user-select:all">14416</b></li><li>In an emergency: <b>112</b></li></ul></div>`;
}
async function stopScreen(){
  STOPPED = true; inProgress = false; $('#stopSlot').hidden = true;
  D.stopped = { at: iso(), screen: screenName };
  render(`<div class="stack"><div><p class="eyebrow">Stopped</p><h1>You have stopped the study</h1></div>
    <p>Thank you for your time. Nothing happens to you because you stopped.</p>
    ${supportCard(true)}
    <div class="card small" id="sbox"><p><b>What should we do with the answers you gave so far?</b></p>
      <div class="btns"><button class="btn ghost" id="keep">Keep them</button><button class="btn ghost" id="drop">Remove them</button></div></div>
    <p class="muted small">You can close this page now. Your code: <span class="code" style="font-size:16px;user-select:all">${esc(pid)}</span></p></div>`, 'stopped');
  const done = async keep => {
    $('#keep').disabled = $('#drop').disabled = true;
    if (!keep){ D.withdrawn = true; D.withdrawnAt = iso(); }
    const ok = await save(keep ? 'stopped' : 'withdrawn');
    $('#sbox').innerHTML = `<p style="margin:0">${ok ? (keep ? 'Thank you. Your answers so far will be kept.' : 'Done. Your answers will be removed and not used.') : `We could not send this. Please email ${esc(CONFIG.researcherEmail)} with your code ${esc(pid)}.`}</p>`;
  };
  $('#keep').addEventListener('click', ()=>done(true));
  $('#drop').addEventListener('click', ()=>done(false));
}
$('#stopBtn').addEventListener('click', stopScreen);

const MOOD_OPTS = ['I feel fine','I feel okay','I feel a bit low','I feel quite low','I feel very low'];
async function moodCheck(){
  render(`<div class="stack"><div><p class="eyebrow">Before you go</p><h2>How are you feeling right now?</h2></div>
    ${pick('mood','',MOOD_OPTS)}
    <div class="btns"><button class="btn" id="go" disabled>Next</button></div></div>`, 'mood');
  gate('#go', ()=>val('mood')!==null);
  await clicked('#go');
  D.moodEnd = MOOD_OPTS.length - +val('mood');   // 5 = fine ... 1 = very low
  D.moodEndAnswer = MOOD_OPTS[+val('mood')];
}

async function debrief(saved){
  progress(); inProgress = false; $('#stopSlot').hidden = true;
  render(`<div class="stack">
    <div><p class="eyebrow">Thank you</p><h1>What this study was really about</h1></div>
    <p>We are studying the <b>words people choose</b> when they write to an AI assistant in a hurry, compared with when they have time.</p>
    ${DISTRESS && D.moodEnd && D.moodEnd <= 2 ? supportCard(true) : ''}
    <p>In daily life, people often use a broad phrase when they mean something specific. Someone may write "${DISTRESS?'I am feeling very stressed these days.':SCENARIOS[0]==='home'?'I am not happy with my spouse. I want a divorce.':'I am not feeling well.'}" when they mean "${DISTRESS?'I have not slept or eaten properly for weeks, I have stopped going to work, and I keep thinking everyone would be better off without me.':SCENARIOS[0]==='home'?'My spouse hit me and threatened me, and I am scared to go home tonight.':'I have chest pain going down my arm.'}" An AI assistant can only respond to the words it receives, so a broad phrase can lead to the wrong kind of help.</p>
    ${(()=>{ const k = D.order[0], b = (D.taskB[k]||{}).text, a = (D.taskA[k]||{}).text; return (b||a) ? `<div class="card"><p style="margin-top:0"><b>Here is what you wrote</b></p><div class="pair">
      <div><div class="lbl">With the timer</div><div class="quote">${b && b.trim() ? esc(b) : '<span class="muted">(nothing typed in time)</span>'}</div></div>
      <div><div class="lbl">With no time limit</div><div class="quote">${a && a.trim() ? esc(a) : '<span class="muted">(nothing typed)</span>'}</div></div></div>
      <p class="small muted" style="margin:10px 0 0">Many people include more detail when they have time. That difference is what we are studying.</p></div>` : ''; })()}
    <p>We did not explain this at the start, because knowing it would have changed how you wrote. The number task was real, but its main purpose was to make the first messages feel like a busy moment in everyday life. There are no right or wrong messages.</p>
    <div class="card small">
      <p><b>Your code:</b> <span class="code" style="user-select:all">${esc(pid)}</span></p>
      <p style="margin:0">Keep this code if you need to contact the research team: ${esc(CONFIG.researcherName)}, <span style="user-select:all">${esc(CONFIG.researcherEmail)}</span>.</p>
    </div>
    <div class="card small" id="wbox">
      <p><b>Changed your mind?</b> Now that you know the aim, you can ask for your answers to be removed. Nothing happens to you if you do.</p>
      <div class="btns"><button class="btn ghost" id="withdraw">Remove my answers</button></div>
    </div>
    ${DISTRESS && !(D.moodEnd <= 2) ? supportCard(false) : ''}
    <div class="card small"${DISTRESS?' hidden':''}><p><b>If a story raised a real concern for you:</b></p>
      <ul class="plain" style="margin:0"><li>Emergency: <b>112</b></li>${SCENARIOS.includes('home')?'<li>Women Helpline: <b>181</b></li><li>Tele-MANAS (free mental health support, any gender): <b>14416</b></li>':''}${SCENARIOS.includes('health')?'<li>Ambulance: <b>108</b></li>':''}${SCENARIOS.includes('fraud')?'<li>Money lost to online or phone fraud: <b>1930</b> (National Cyber Crime Helpline) or cybercrime.gov.in</li>':''}</ul></div>
    ${saved ? '' : downloadBlock()}
    ${PREVIEW ? `<div class="card small"><p><b>Preview mode.</b> Nothing was sent. This is the data a real session records:</p><pre class="dump">${esc(JSON.stringify(D, null, 1))}</pre></div>` : ''}
    <p class="muted small">You can close this page now.</p></div>`, 'debrief');
  if (!saved) wireDownload();
  $('#withdraw').addEventListener('click', async ()=>{
    $('#withdraw').disabled = true;
    D.withdrawn = true; D.withdrawnAt = iso();
    const ok = await save('withdrawn');
    $('#wbox').innerHTML = ok ? `<p style="margin:0"><b>Done.</b> Your answers will be removed and not used.</p>`
      : `<p style="margin:0"><b>We could not send your request.</b> Please email ${esc(CONFIG.researcherEmail)} with your code ${esc(pid)}, and your answers will be removed.</p>`;
  });
}

/* =========================================================================
   FLOW
   ========================================================================= */
async function run(){
  await welcome();
  await aboutYou();
  save('started');
  await howItWorks();

  // Practice (not analysed)
  progress();
  D.practice = await quickRound('practice', 'Practice');
  save('practice');
  await interstitial('Practice finished', NS===1 ? 'Now the real round begins.' : `Now the real rounds begin. There are ${WORDS[NS-1]}.`, 'Continue');

  // Task B — quick, timed, under memory load
  for (let i=0;i<NS;i++){
    progress();
    const key = D.order[i];
    D.taskB[key] = { position: i+1, ...(await quickRound(key, NS===1 ? 'The real round' : `Round ${i+1} of ${NS}`)) };
    Object.assign(D.taskB[key], await feelScreen());
  }
  save('partB'); // checkpoint, not awaited

  await puzzle();

  // Task A — same stories, no timer, no number
  progress();
  await interstitial('Part 2', NS===1 ? 'You will see the same story again. This time there is no number to remember and no time limit.' : `You will see the same ${WORDS[NS-1]} stories again. This time there is no number to remember and no time limit.`, 'Continue');
  for (let i=0;i<NS;i++){
    progress();
    const key = D.order[i];
    render(`<div class="stack"><div><p class="eyebrow">${NS>1?`Story ${i+1} of ${NS}`:'The same story'}</p><h2>Read the story again. Imagine this is you.</h2></div>${storyWithText(key)}
      <div class="btns"><button class="btn" id="go">Continue</button></div></div>`, 'Astory_'+key);
    await clicked('#go');
    D.taskA[key] = { position: i+1, ...(await chatScreen(key, { timed:false, eyebrow: NS>1 ? `Story ${i+1} of ${NS} · no time limit` : 'No time limit',
      title:'Write to the assistant as precisely as you can about what is happening and what help you need' })) };
  }
  save('careful');

  progress();
  for (let i=0;i<NS;i++) await afterQuestions(D.order[i], i);

  save('questions');
  await awareness();            // before anything that hints at what we measure
  for (let i=0;i<NS;i++) await comprehension(D.order[i]);
  await languageBackground();
  save('language');
  if (CONFIG.lextale){ await lextale(); save('wordtest'); }
  if (DISTRESS) await moodCheck();

  D.completedAt = iso();
  D.screenTimes.push([screenName, Math.round(now()-screenStart)]);
  const saved = await save('final');
  await debrief(saved);
}
run();
</script>
